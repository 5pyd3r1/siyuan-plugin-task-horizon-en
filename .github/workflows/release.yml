name: release

# Manual/tag release path: pushing a tag matching v<version>-en.<n> builds the
# English package through the shared build-release pipeline.
# Automatic upstream releases are handled by upstream-sync.yml.

on:
  push:
    tags:
      - 'v*.*.*-en.*'

permissions:
  contents: write

jobs:
  build-and-release:
    permissions:
      contents: write
    uses: ./.github/workflows/build-release.yml
    with:
      tag: ${{ github.ref_name }}
